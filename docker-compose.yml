services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: posturi_dev
      POSTGRES_USER: posturi
      POSTGRES_PASSWORD: posturi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 avoids conflict with a local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posturi -d posturi_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
