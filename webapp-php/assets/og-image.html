<!doctype html><html><head><meta charset="utf-8"><style>
@import url('../static/gov2/fonts.css');
:root{--ink:11 12 12;--bg:255 255 255;--brand:11 61 145;--muted:80 90 95}
html,body{margin:0;width:1200px;height:630px}
body{background:rgb(var(--bg));color:rgb(var(--ink));font-family:Inter,sans-serif;display:flex;flex-direction:column;box-sizing:border-box}
.bar{background:rgb(var(--ink));color:#fff;height:132px;display:flex;align-items:center;padding:0 80px;border-bottom:16px solid rgb(var(--brand));font-size:60px;font-weight:700;letter-spacing:-.03em}
.bar em{font-style:normal;font-weight:500;color:#c9ced1}
.bar small{font-size:26px;font-weight:500;color:#c9ced1;margin-left:20px;letter-spacing:0}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:36px;padding:0 80px}
h1{font-size:76px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:0;max-width:1000px}
p{font-size:32px;line-height:1.35;color:rgb(var(--muted));margin:0}
p b{color:rgb(var(--ink))}
</style></head><body>
<div class="bar"><span>posturi<em>.gov2.ro</em></span><small>beta</small></div>
<div class="main">
<h1>Anunțuri de angajare în administrația publică</h1>
<p>Proiect independent. <b>Nu este un site oficial</b> al Guvernului României.</p>
</div>
</body></html>
