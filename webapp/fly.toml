# Fly.io app configuration for posturi.gov.ro webapp
# Deploy: fly launch (first time) or fly deploy (updates)
# Required secrets: fly secrets set SECRET_KEY=... DATABASE_URL=... GOOGLE_API_KEY=...

app = "posturi-gov-ro"
primary_region = "waw"   # Warsaw — closest to Romania

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "0"
  ALLOWED_HOSTS = "posturi-gov-ro.fly.dev,posturi.gov.ro"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Run Django migrations before deploying new code
[deploy]
  release_command = "python manage.py migrate --noinput"
